<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t">
  <title id="t">潤い・思いやり・連帯感を表す図案</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A961"/><stop offset="1" stop-color="#8F6E27"/>
    </linearGradient>
    <radialGradient id="soft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E9DCB8" stop-opacity=".55"/><stop offset="1" stop-color="#E9DCB8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="600" fill="#FBF8F2"/>
  <rect x="18" y="18" width="924" height="564" fill="none" stroke="#C1A05C" stroke-width="1"/>
  <rect x="26" y="26" width="908" height="548" fill="none" stroke="#E4D3A8" stroke-width="1"/>

  <!-- 潤い : droplet and ripples -->
  <g transform="translate(200 300)">
    <circle r="120" fill="url(#soft)"/>
    <g fill="none" stroke="url(#g)" stroke-width="1.6">
      <ellipse cx="0" cy="62" rx="30" ry="9" opacity=".9"/>
      <ellipse cx="0" cy="62" rx="60" ry="18" opacity=".6"/>
      <ellipse cx="0" cy="62" rx="90" ry="27" opacity=".35"/>
    </g>
    <path d="M0 -70 C 18 -40 38 -20 38 4 A38 38 0 0 1 -38 4 C -38 -20 -18 -40 0 -70 Z" fill="none" stroke="url(#g)" stroke-width="2.2"/>
    <path d="M-16 4 A20 20 0 0 0 -8 20" fill="none" stroke="#C9A961" stroke-width="1.4" stroke-linecap="round"/>
    <text x="0" y="136" text-anchor="middle" font-family="'Shippori Mincho','Yu Mincho',serif" font-size="32" fill="#9C7A2E" letter-spacing="6">潤い</text>
    <text x="0" y="164" text-anchor="middle" font-family="'Cormorant Garamond','Times New Roman',serif" font-size="16" fill="#B3915C" letter-spacing="5">URUOI</text>
  </g>

  <!-- 思いやり : two hands cradling a small light -->
  <g transform="translate(480 300)">
    <circle r="120" fill="url(#soft)"/>
    <g fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-78 -6 C -84 22 -66 52 -30 60 C -8 65 6 58 14 50"/>
      <path d="M-78 -6 C -70 -16 -58 -14 -52 -4 M-66 -18 C -58 -30 -46 -26 -42 -14 M-52 -26 C -44 -38 -32 -32 -30 -20 M-36 -28 C -28 -38 -18 -32 -18 -22"/>
      <path d="M78 -6 C 84 22 66 52 30 60 C 8 65 -6 58 -14 50"/>
      <path d="M78 -6 C 70 -16 58 -14 52 -4 M66 -18 C 58 -30 46 -26 42 -14 M52 -26 C 44 -38 32 -32 30 -20 M36 -28 C 28 -38 18 -32 18 -22"/>
    </g>
    <circle cx="0" cy="-16" r="14" fill="none" stroke="#C9A961" stroke-width="1.6"/>
    <circle cx="0" cy="-16" r="5" fill="#C9A961"/>
    <g stroke="#E4D3A8" stroke-width="1.2" stroke-linecap="round">
      <path d="M0 -44 v-10 M22 -36 l6 -7 M-22 -36 l-6 -7"/>
    </g>
    <text x="0" y="136" text-anchor="middle" font-family="'Shippori Mincho','Yu Mincho',serif" font-size="32" fill="#9C7A2E" letter-spacing="6">思いやり</text>
    <text x="0" y="164" text-anchor="middle" font-family="'Cormorant Garamond','Times New Roman',serif" font-size="16" fill="#B3915C" letter-spacing="5">OMOIYARI</text>
  </g>

  <!-- 連帯感 : three interlocking rings -->
  <g transform="translate(760 300)">
    <circle r="120" fill="url(#soft)"/>
    <g fill="none" stroke="url(#g)" stroke-width="2.2">
      <circle cx="-26" cy="-14" r="38"/>
      <circle cx="26" cy="-14" r="38"/>
      <circle cx="0" cy="30" r="38"/>
    </g>
    <circle cx="0" cy="0" r="3.5" fill="#9C7A2E"/>
    <text x="0" y="136" text-anchor="middle" font-family="'Shippori Mincho','Yu Mincho',serif" font-size="32" fill="#9C7A2E" letter-spacing="6">連帯感</text>
    <text x="0" y="164" text-anchor="middle" font-family="'Cormorant Garamond','Times New Roman',serif" font-size="16" fill="#B3915C" letter-spacing="5">SOLIDARITY</text>
  </g>

  <!-- connecting hairline -->
  <path d="M300 300 H380 M580 300 H660" stroke="#E4D3A8" stroke-width="1"/>
  <text x="480" y="74" text-anchor="middle" font-family="'Cormorant Garamond','Times New Roman',serif" font-size="18" fill="#B3915C" letter-spacing="10">HASH GROUP VISION</text>
</svg>
